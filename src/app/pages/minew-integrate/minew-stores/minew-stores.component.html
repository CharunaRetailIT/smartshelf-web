<div class="bg-white p-6 sm:p-8 rounded-lg shadow-md max-w-2xl mx-auto">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl sm:text-2xl font-semibold text-[var(--color-secondary)]">Select or Manage Stores</h2>
    <button
      (click)="onLogout()"
      class="bg-[var(--color-secondary)] text-white px-4 py-2 rounded-md hover:bg-[var(--color-secondary-dark)]"
    >
      Logout
    </button>
  </div>

  <!-- Store List -->
   <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center items-center py-12">
      <mat-spinner [diameter]="50" class="text-primary"></mat-spinner>
    </div>  <div *ngIf="errorMessage" class="text-red-500 mb-4">{{ errorMessage }}</div>
  <ul *ngIf="!isLoading && stores.length" class="space-y-4">
    <li *ngFor="let store of stores" class="flex items-center justify-between p-4 border border-[var(--color-primary-light)] rounded-md">
      <div>
        <p class="font-medium text-[var(--color-secondary-dark)]">{{ store.storeName }}</p>
        <p class="text-sm text-gray-600">{{ store.address || 'No address' }}</p>
      </div>
      <div class="flex space-x-2">
        <button
          (click)="selectStore(store)"
          class="bg-[var(--color-primary)] text-white px-3 py-1 rounded-md hover:bg-[var(--color-primary-dark)]"
        >
          Select
        </button>
        <button
          (click)="toggleStore(store)"
          class="bg-[var(--color-secondary-light)] text-white px-3 py-1 rounded-md hover:bg-[var(--color-secondary-dark)]"
        >
          {{ store.active ? 'Close' : 'Open' }}
        </button>
      </div>
    </li>
  </ul>

  <!-- Add Store Form -->
  <form (ngSubmit)="addStore()" class="mt-6 space-y-4">
    <h3 class="text-lg font-medium text-[var(--color-secondary)]">Add New Store</h3>
    <div>
      <label for="storeName" class="block text-sm font-medium text-[var(--color-secondary-dark)]">Store Name</label>
      <input
        id="storeName"
        type="text"
        [(ngModel)]="newStore.storeName"
        name="storeName"
        class="w-full p-2 border border-[var(--color-primary-light)] rounded-md focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]"
        required
      />
    </div>
    <div>
      <label for="address" class="block text-sm font-medium text-[var(--color-secondary-dark)]">Address</label>
      <input
        id="address"
        type="text"
        [(ngModel)]="newStore.address"
        name="address"
        class="w-full p-2 border border-[var(--color-primary-light)] rounded-md focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-[var(--color-primary)] text-white py-2 rounded-md hover:bg-[var(--color-primary-dark)]"
    >
      Add Store
    </button>
  </form>
</div>
