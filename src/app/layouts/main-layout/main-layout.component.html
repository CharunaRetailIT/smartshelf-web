<app-sidebar
  [isLeftSidebarCollapsed]="isSidebarCollapsed()"
  (changeIsLeftSidebarCollapsed)="toggleSidebar($event)"
>
  <div class="body">
    <app-header
      *ngIf="showHeader()"
      [isLeftSidebarCollapsed]="isSidebarCollapsed()"
      (toggleSidebar)="changeIsLeftSidebarCollapsed($event)"
    />
    <main class="page-content" [class.no-header]="!showHeader()">
      <!-- for notifications -->
      <p-toast position="top-right"></p-toast>
      <!-- One confirmation dialog for the whole app. ConfirmationService only
           publishes to a rendered <p-confirmDialog>; pages that called it
           without one had their confirmations silently do nothing. -->
      <p-confirmDialog></p-confirmDialog>
      <router-outlet></router-outlet>
    </main>
  </div>
</app-sidebar>
