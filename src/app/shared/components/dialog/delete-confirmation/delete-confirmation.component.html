<div class="dlg-confirm">
  <!-- Header -->
  <div class="dlg-confirm-head">
    <span class="dlg-icon-badge dlg-icon-badge--danger" aria-hidden="true">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"
        ></path>
      </svg>
    </span>
    <h3 class="dlg-confirm-title">{{ data.title }}</h3>
  </div>

  <!-- Content -->
  <p class="dlg-confirm-message">{{ data.message }}</p>

  <!-- Actions -->
  <div class="dlg-confirm-actions">
    <button type="button" (click)="onCancel()" class="dlg-btn dlg-btn-secondary">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button type="button" (click)="onConfirm()" class="dlg-btn dlg-btn-danger">
      {{ data.confirmText || 'Delete' }}
    </button>
  </div>
</div>
