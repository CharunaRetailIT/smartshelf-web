<mat-sidenav-container class="sidebar-container" autosize>
  <mat-sidenav
    #sidenav
    [mode]="'side'"
    [opened]="true"
    [class.expanded]="!isLeftSidebarCollapsed()"
    [class.collapsed]="isLeftSidebarCollapsed()"
    class="app-sidenav"
  >
    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-content" [class.centered]="isLeftSidebarCollapsed()">
        <button class="logo-icon" (click)="toggleCollapse()">
          <i class="fas fa-bars"></i>
        </button>
        <div class="logo-text" *ngIf="!isLeftSidebarCollapsed()">
          <span class="brand-name">Smart ESL</span>
          <!-- The store everything on screen is scoped to. Hidden rather than
               left blank when no store is set. -->
          <span
            class="store-name"
            *ngIf="defaultStore$ | async as store"
            [matTooltip]="store.storeName"
            matTooltipPosition="right"
          >
            {{ store.storeName }}
          </span>
          <!-- <span>Version 1.2.0</span> -->
        </div>

        <!-- <button
          *ngIf="!isLeftSidebarCollapsed()"
          class="btn-close"
          (click)="closeSidenav()"
          mat-icon-button
        >
          <i class="fas fa-times"></i>
        </button> -->
      </div>
    </div>

    <!-- Navigation Menu -->
    <mat-nav-list class="nav-list" disableRipple>
      <a
        mat-list-item
        *ngFor="let item of items"
        [routerLink]="item.routeLink"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        [matTooltip]="isLeftSidebarCollapsed() ? item.label : ''"
        matTooltipPosition="right"
      >
        <i class="nav-icon" [ngClass]="item.icon"></i>
        <span class="nav-label" *ngIf="!isLeftSidebarCollapsed()">
          {{ item.label }}
        </span>
      </a>
    </mat-nav-list>

    <!-- User Section -->
    <div class="user-section">
      <div class="user-separator"></div>

      <div
        *ngIf="currentUser$ | async as user"
        class="user-info"
        [class.centered]="isLeftSidebarCollapsed()"
      >
        <div class="user-avatar">
          <i class="fas fa-user"></i>
        </div>
        <div class="user-details" *ngIf="!isLeftSidebarCollapsed()">
          <span class="user-name"
            >{{ user.firstName }} {{ user.lastName }}</span
          >
        </div>
      </div>

      <div class="powered-by" *ngIf="!isLeftSidebarCollapsed()">
        <span>Powered by RETAIL IT</span>
        <span class="copyright">© 2026</span>
      </div>

      <div
        class="powered-by-collapsed"
        *ngIf="isLeftSidebarCollapsed()"
        [matTooltip]="'Powered by RETAIL IT © 2026'"
        matTooltipPosition="right"
      >
        <span>RI</span>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <ng-content></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
