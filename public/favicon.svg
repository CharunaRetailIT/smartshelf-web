<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-label="Smart ESL"
>
  <!--
    Smart ESL app icon.

    The Retail IT mark (green tile, white R, yellow dot) kept intact so the
    icon stays recognisable, with one addition that makes it read as an
    electronic shelf label: the white price strip under the mark, the bold
    e-ink line every ESL shows. The yellow dot doubles as the tag's status /
    wireless indicator.

    Deliberately four shapes and no fine detail. An earlier version also had an
    inset "bezel" outline, which looked good at 128px and turned to mush in a
    16px browser tab; the strip alone carries the idea at every size.
  -->
  <rect width="64" height="64" rx="14" fill="#15803d" />

  <!-- status / wireless indicator -->
  <circle cx="49" cy="16" r="6" fill="#ffc329" />

  <!-- brand mark -->
  <text
    x="31"
    y="44"
    font-family="Helvetica, Arial, sans-serif"
    font-size="38"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
  >
    R
  </text>

  <!-- price strip -->
  <rect
    x="20"
    y="51"
    width="24"
    height="5"
    rx="2.5"
    fill="#ffffff"
    fill-opacity="0.9"
  />
</svg>
